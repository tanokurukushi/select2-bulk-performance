<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Select2大量生成パフォーマンスチェック</title>
    <meta
      name="description"
      content="Select2のダミーデータを大量に生成して、通常の方法と最適化した方法で初期化にかかる時間を比較します。"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"
      integrity="sha256-FWksJmZJ+8istOv7NF5+lJlIbZVRFIJBojXJ1i7qL1U="
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css"
      integrity="sha256-XV4U1Ycwi10a159R6a6i+PRpsKArM19Vn1pLt1a4Fzc="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/simpledotcss@2.3.7/simple.min.css"
      integrity="sha256-+wYkWCZ55K+QUmjg+0YRKFg6SbXZ5dhnXRyeL8NMfT0="
      crossorigin="anonymous"
    />
    <script type="module" src="/index.js"></script>
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <main class="container">
      <header>
        <h1>Select2大量生成パフォーマンスチェック</h1>
        <p>
          Select2のダミーデータを大量に生成して、通常の方法と最適化した方法で初期化にかかる時間を比較します。
        </p>
      </header>
      <section>
        <h2>生成条件</h2>
        <label for="select-count">Select2の個数</label>
        <input type="number" id="select-count" name="select-count" min="1" value="100" />
        <label for="option-count">Select2の選択肢の数</label>
        <input type="number" id="option-count" name="option-count" min="1" value="1000" />
        <fieldset>
          <legend>生成モード</legend>
          <input type="radio" id="mode-normal" name="mode" value="normal" checked />
          <label for="mode-normal">通常</label>
          <input type="radio" id="mode-optimized" name="mode" value="optimized" />
          <label for="mode-optimized">最適化</label>
        </fieldset>
        <blockquote id="mode-desc"></blockquote>
        <button type="button" id="generate">生成する</button>
      </section>
      <section>
        <h2>パフォーマンス</h2>
        <table>
          <thead>
            <tr>
              <td>項目</td>
              <td>経過時間</td>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>HTML生成</td>
              <td id="html-generate-time">未計測</td>
            </tr>
            <tr>
              <td>Select2初期化</td>
              <td id="select2-initialize-time">未計測</td>
            </tr>
            <tr>
              <td>合計</td>
              <td id="elapsed-time">未計測</td>
            </tr>
          </tbody>
        </table>
      </section>
      <section>
        <h2>生成結果</h2>
        <div id="result-form">
          <div>ここに生成結果を表示します</div>
        </div>
      </section>
    </main>
  </body>
</html>
